name: Build APK (armeabi-v7a)

on:
  workflow_dispatch:   # Bouton "Run workflow" pour lancer manuellement
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35'

      - name: Create Gradle Wrapper (if missing)
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Creating Gradle Wrapper..."
            # Download a recent Gradle and generate the wrapper
            curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
            unzip -q gradle.zip
            ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9
            chmod +x gradlew
            rm -rf gradle-8.9 gradle.zip
          else
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List APK files
        run: find app/build/outputs -name "*.apk" -ls

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-v0.1-armeabi-v7a
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
